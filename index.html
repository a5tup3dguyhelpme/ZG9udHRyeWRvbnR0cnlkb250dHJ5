
<!DOCTYPE html>
<html>
<head>
    <title>Final</title>
<script>
if(localStorage.getItem("baneado") === "si"){
    document.documentElement.innerHTML = `
    <body style="background:black; color:red; text-align:center; font-family:monospace;">
        <h1again?</h1>
        <p>don´t try bro.</p>
    </body>
    `;
    throw new Error("Acceso bloqueado");

<style>
.glitch {
    animation: glitch 0.2s infinite;
}

@keyframes glitch {
    0% { transform: translate(2px, -2px); }
    25% { transform: translate(-2px, 2px); }
    50% { transform: translate(2px, 2px); }
    75% { transform: translate(-2px, -2px); }
    100% { transform: translate(0px, 0px); }
}

.flash {
    animation: flash 0.1s infinite;
}

@keyframes flash {
    0% { background: black; }
    50% { background: darkred; }
    100% { background: black; }
}
</style>

<script>
// 🔒 bloqueo si ya está baneado
if(localStorage.getItem("baneado") === "si"){
    document.write("<h1 style='color:red; text-align:center;'>AGAIN?</h1><p style='text-align:center;'>No debiste regresar.</p>");
}
</script>

</head>

<body style="background:black; color:white; text-align:center; font-family:monospace;">

<h2>put the answer:</h2>

<textarea id="respuesta" placeholder="write right here..."
style="width: 80%; height: 200px; font-size:16px; padding:10px; background:black; color:white; border:2px solid white;"></textarea>

<br><br>
<button onclick="verificar()">send</button>

<p id="mensaje"></p>

<script>
async function verificar() {
    const input = document.getElementById("respuesta").value.trim();

    
    const hashCorrecto = "b827bf3ba98cbfd7d251647937c5f6851621c03e8636131a59db262445e5483b";

    const encoder = new TextEncoder();
    const data = encoder.encode(input);
    const hashBuffer = await crypto.subtle.digest("SHA-256", data);
    const hashArray = Array.from(new Uint8Array(hashBuffer));
    const hashUsuario = hashArray.map(b => b.toString(16).padStart(2, "0")).join("");

    if(hashUsuario === hashCorrecto){

       
        localStorage.setItem("baneado", "si");

        document.getElementById("mensaje").innerHTML = "yes, correct, but you took too long";

        // 🚫 bloquear input
        document.getElementById("respuesta").disabled = true;
        document.querySelector("button").disabled = true;

        // 👁️ glitch
        document.body.classList.add("glitch");
        document.body.classList.add("flash");

        // 💀 mensaje creepy
        setTimeout(() => {
            document.getElementById("mensaje").innerHTML = "well, i think we’ll see later... or maybe not";
        }, 1000);

        // ⏳ expulsión en 5 segundos
        setTimeout(() => {
            window.location.href = "https://www.google.com";
        }, 3000);

    } else {
        document.getElementById("mensaje").innerHTML = "incorrect";
    }
}
</script>

</body>
</html>
