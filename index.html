
<!DOCTYPE html>
<html>
<head>
    <title>Final</title>
    <style>
.glitch {
    animation: glitch 0.2s infinite;
}

@keyframes glitch {
    0% { transform: translate(2px, -2px); }
    25% { transform: translate(-2px, 2px); }
    50% { transform: translate(2px, 2px); }
    75% { transform: translate(-2px, -2px); }
    100% { transform: translate(0px, 0px); }
}

.flash {
    animation: flash 0.1s infinite;
}

@keyframes flash {
    0% { background: black; }
    50% { background: darkred; }
    100% { background: black; }
}
</style>
    

    <script>
    // 🔒 si ya está baneado, no deja entrar
    if(localStorage.getItem("baneado") === "si"){
        document.write("<h1 style='color:red; text-align:center;'>ACCESO DENEGADO</h1><p style='text-align:center;'>No debiste regresar.</p>");
    }
    </script>
</head>
<body style="background:black; color:white; text-align:center; font-family:monospace;">

<h2>Introduce la respuesta final:</h2>

<textarea id="respuesta" placeholder="Escribe aquí..." 
style="width: 80%; height: 200px; font-size:16px; padding:10px; background:black; color:white; border:2px solid white;"></textarea>
<br><br>
<button onclick="verificar()">Enviar</button>

<p id="mensaje"></p>

<script>
function verificar() {
    const input = document.getElementById("respuesta").value.trim();
    
    // 👇 AQUÍ pones la respuesta correcta (ya decodificada)
    const correcta = "heyyyyy, bueno, parece que perdiste tu tiempo de nuevo, normal, no hay nada aquí interesante, o si?, bueno, vamos a ver si puedes descifrar esto ultimo:cmon bro, dont lose ur time with this, youll get fooled by someone";

    if(input.toLowerCase() === correcta.toLowerCase()){
        document.getElementById("mensaje").innerHTML = "Correcto... pero ya es tarde.";
        
    // 🔒 guardar baneo primero
    localStorage.setItem("baneado", "si");

    document.getElementById("mensaje").innerHTML = "Correcto... pero ya es tarde.";

    // 🚫 bloquear input
    document.getElementById("respuesta").disabled = true;
    document.querySelector("button").disabled = true;
         // 👁️ activar glitch
    document.body.classList.add("glitch");
    document.body.classList.add("flash");
           // 💀 mensaje creepy
    setTimeout(() => {
        document.getElementById("mensaje").innerHTML = "well, i i think we´ll see later, or maybe not";
    }, 2000);

        // ⏳ espera 5 segundos y los saca
        setTimeout(() => {
            window.location.href = "https://www.google.com";
        }, 5000);


        
    } else {
        document.getElementById("mensaje").innerHTML = "Incorrecto.";
    }
}
</script>

</body>
</html>
